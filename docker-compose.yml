services:
  mysql:
    image: mysql:8.0
    container_name: storyworkshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-123456}
      MYSQL_DATABASE: story_workshop
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动时按文件名顺序自动建库建表 + 灌入主线数据
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    networks:
      - story-net

  backend:
    build:
      context: ./backend
    container_name: storyworkshop-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: story_workshop
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_PASSWORD:-123456}
      TZ: Asia/Shanghai
    ports:
      # 容器内 8080，映射到宿主机 8081，与现有前端代理保持一致
      - "8081:8080"
    volumes:
      # 封面上传文件保存在命名卷中，重建容器不会丢失
      - uploads_data:/app/uploads
    networks:
      - story-net

volumes:
  mysql_data:
  uploads_data:

networks:
  story-net:
