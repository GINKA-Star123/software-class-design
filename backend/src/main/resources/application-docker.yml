spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:story_workshop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Hong_Kong&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

app:
  upload:
    # 容器内上传目录，与 docker-compose.yml 的命名卷保持一致
    root-path: /app/uploads
    cover-path: covers
    avatar-path: avatars

logging:
  level:
    com.example.storyworkshop: info
    org.mybatis: info
